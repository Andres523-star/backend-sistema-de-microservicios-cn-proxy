spring.application.name=microservice-monitor

# Railway inyecta PORT; en local usa 8080
server.port=${PORT:8080}

# Muestra el requestId en cada linea de log del servidor
logging.pattern.level=%5p [%X{requestId:-}]

# --- Configuracion de la aplicacion -------------------------------------
# Maximo de logs guardados en memoria (los mas antiguos se descartan)
monitor.log.max-entries=5000
# Probabilidad de fallo intencional de PaymentService (0.10 = 10%)
monitor.payment.failure-rate=0.10
# Simula latencia de red/negocio en los servicios (para que las graficas tengan sentido)
monitor.latency.enabled=true
# Umbral (%) de tasa de error a partir del cual un servicio se marca en rojo
monitor.error-rate-threshold=15
# Origenes permitidos por CORS, separados por coma. Acepta patrones: https://*.vercel.app
monitor.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
